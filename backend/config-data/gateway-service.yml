server:
  port: 8080

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      default-zone: http://localhost:8761/eureka
  instance:
    hostname: localhost

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: package-service
          uri: lb://PACKAGE-SERVICE
          predicates:
            - Path=/api/tourpackage/**
        - id: booking-service
          uri: lb://BOOKINGSERVICE
          predicates:
            - Path=/api/reservation/**
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/user/**