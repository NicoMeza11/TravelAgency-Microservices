spring.application.name=user-service
server.port=0
#spring.config.import=configserver:http://config-service:8090
#spring.config.import=configserver:http://localhost:8090
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://${KC_ISSUER_HOST}/realms/${KC_REALM_NAME}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://${KC_HOST}/realms/${KC_REALM_NAME}/protocol/openid-connect/certs

jwt.auth.converter.principle-attribute=preferred-username
jwt.auth.converter.resource-id=spring-client-api-rest
logging.level.org.keycloak=DEBUG

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


