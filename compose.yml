version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.7
    container_name: keycloak-microservicio
    environment:
      KC_DB: postgres
      # Apuntamos al host de tu sistema operativo mediante host.docker.internal
      KC_DB_URL: jdbc:postgresql://host.docker.internal:5432/db_keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: nico11
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json
    command: start-dev --import-realm
    networks:
      - backend-network

networks:
  backend-network:
    external: true